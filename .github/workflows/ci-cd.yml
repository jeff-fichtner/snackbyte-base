# THIS REPO'S OWN CI. snackbyte-base runs it to validate and tag its own releases — that is where
# its `v1.x` tags come from. It is NOT handed to the apps the hub composes: the hub resolver
# (hub/init.mjs) DELETES this file, and `.github/` with it. CI is installed per repo
# from CONSUMING.md in jeff-fichtner/snackbyte-release-flow-action, which owns the wiring — a copy
# shipped from here would be a second, staler copy of it.
#
# Validate on pull requests; version and tag on pushes to the environment branches. Which branches
# are environments lives in environments.json, which the release-flow Action reads; the push trigger
# below lists the same branches, so a push to a work branch runs nothing (its checks run on its pull
# request) and adding an environment means adding its branch here too.
#
# THE RELEASE FLOW IS DELEGATED to `snackbyte-release-flow-action`, which resolves whether the
# pushed branch is an environment and, if so, derives and pushes the tag — a tag only, never a
# commit. The derivation rules, the repo settings the flow needs, and the app-vs-library
# version-strategy choice all live in the Action's CONSUMING.md; nothing here restates them.
#
# Every job bills at least a whole minute, so there are as few as possible: one check job for pull
# requests (`validate (merge gate)`, the check branch protection requires), and on push the checks
# run inside the tag-writing job, before the tag, so a failed check leaves no tag. A promotion
# (dev → main) of a tree already released skips those checks: the look-up finds the tag the tree
# was released as, and a tag made in this job means the tree passed them.
#
# Path filters belong to releases, never to merge gates: a merge gate that skips on a path filter
# reports nothing, and branch protection waits on it forever. A repository holding a second
# releasable gives each its own release workflow, filtered to its paths, beside one merge gate that
# checks everything — the aggregator shape in snackbyte-npm-base's SUBDIR-LAYOUT.md.
#
# This workflow DELIBERATELY has no `deploy` job — this repo is a template, and deploys nowhere.
#
# Every `uses:` is pinned to a full commit SHA, with the release it tracks in a comment, and the
# repository's Actions settings require that pin: a moved tag would otherwise be arbitrary code
# running with this workflow's token, which can push tags. .github/dependabot.yml moves the pins.
name: ci-cd

on:
  pull_request:
  push:
    branches: [main, dev] # the environment branches in environments.json

permissions:
  contents: read # each job raises only what it needs

env:
  NODE_VERSION: '26' # Node major for the gate (keep aligned with .nvmrc)

jobs:
  # Merge gate: PRs must pass the quality gate before they can merge. (The merge is *enforced* by
  # branch protection requiring this check — repo config, not expressible here.)
  validate:
    name: validate (merge gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    # A new push to the pull request replaces the run in flight.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            templates/*/package-lock.json
      # The C# server template builds with the .NET 8 SDK (its global.json takes any 8.0 SDK).
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - run: npm ci
      # Every template is its own project: install each (the hub's own tests compose apps from them).
      - run: npm run setup
      - run: npm run check:all

  # Look up the push, run the checks unless this tree is already released, then derive and push the
  # tag. The Action resolves whether the branch is an environment; a push that is not one tags
  # nothing. Adding an environment is a row in environments.json plus its branch in the trigger.
  version-and-tag:
    name: version and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize per RELEASABLE, not per branch: the build id is global across every environment
    # branch, so a per-branch group lets main and dev race to the same number. It also keeps the
    # look-up and the tag in step.
    concurrency:
      group: release
      cancel-in-progress: false
      queue: max # let runs wait their turn; without it a queued release can be thrown away
    permissions:
      contents: write # to push the TAG only (we never push a commit to the branch)
    outputs:
      is-env: ${{ steps.release.outputs.is-env }} # "true"/"false"
      version: ${{ steps.release.outputs.version }} # plain number, e.g. 1.5.4 (env pushes only)
      tag: ${{ steps.release.outputs.tag }} # git tag, e.g. v1.5.4-dev (staging) or v1.5.4 (prod)
      released-as: ${{ steps.lookup.outputs.released-as }} # the tag this tree already had, if any
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A GITHUB_TOKEN-pushed tag does NOT trigger another workflow (GitHub's recursion guard),
          # which is fine: nothing here needs a second event, and no personal access token is
          # required.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # full history + tags — the Action's derivation refuses a shallow clone

      # Derive and report, creating nothing: `released-as` names the tag this exact tree was already
      # released as (a promotion), or is empty for new code. Every refusal the derivation makes
      # happens here, before the checks.
      - name: Look up this push
        id: lookup
        uses: jeff-fichtner/snackbyte-release-flow-action@01d5fa53356ad4b04b2388a43eda867cc947b670 # v1.2.7
        with:
          mode: lookup

      # Push-side gate: new code must be green before anything is tagged. On failure the job stops
      # here and no tag is created. Every check step carries the same condition, so a promotion of
      # an already-released tree skips them all.
      - if: steps.lookup.outputs.released-as == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            templates/*/package-lock.json
      - if: steps.lookup.outputs.released-as == ''
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '8.0.x'
      - if: steps.lookup.outputs.released-as == ''
        run: npm ci
      - if: steps.lookup.outputs.released-as == ''
        run: npm run setup
      - if: steps.lookup.outputs.released-as == ''
        run: npm run check:all

      # Derive and push the version tag, refusing any tag the look-up did not report. All inputs
      # default: branch = github.ref_name, manifest = ./environments.json, major-minor from
      # package.json's version, version-strategy = build-id (a deployable app's; a published library
      # would set package-json).
      - name: Resolve environment and derive version tag
        id: release
        uses: jeff-fichtner/snackbyte-release-flow-action@01d5fa53356ad4b04b2388a43eda867cc947b670 # v1.2.7
        with:
          expect-tag: ${{ steps.lookup.outputs.tag }}
