# ACTIVE IN THIS TEMPLATE REPO. Historically this file shipped inert as `ci-cd.yml.disabled` so an
# un-resolved template would not run CI or derive a version tag on a push. That is no longer the
# case for snackbyte-base itself: the template repo now runs its own CI and tags its own releases
# (that is why `v1.x` tags exist on it). It still ships NO deploy job — this repo validates, versions,
# and tags, but deploys nowhere. A `deploy` job is per-app and is copied in at wire-up time (DEPLOY.md).
#
# For apps spun up from this template, the spin-up resolver (scripts/init.mjs) keeps handling the
# workflow: it de-templates this header (the app gets an app-appropriate one) and, on any repo where
# the file is still `ci-cd.yml.disabled`, renames it to `ci-cd.yml`. Since this template file is
# already `ci-cd.yml`, the resolver's rename is a no-op and only the header rewrite applies.
#
# Validate, version, and tag — the pushed branch selects the environment (via environments.json).
#
# Every app spun up from this template inherits this workflow. The release flow is the same
# everywhere: GitHub-hosted, npm, a quality gate, and a git tag as the deploy signal. Which
# branches are environments is NOT hard-coded here — it lives in environments.json (the default
# ships `main` -> production and `dev` -> staging). The trigger can't read that file (GitHub
# evaluates `on:` before checkout), so this workflow triggers on any push and a lightweight
# `resolve-env` job reads the manifest and short-circuits a push to a non-environment branch.
# Adding an environment is a one-row edit to environments.json — this workflow needs no change.
#
# VERSIONING — derived from tags, never committed. package.json holds only MAJOR.MINOR; the
# PATCH is a global, monotonic build id derived from existing tags (see scripts/derive-version.sh).
# CI creates a tag and pushes ONLY the tag — no commit, no branch push — so environment branches
# never diverge: fast-forward, merge, and PR promotion all work, with no resync and no collisions.
#
# Two independent gates protect a release: a PR is blocked until `check:all` passes (enforced by
# branch protection, not this file — see DEPLOY.md), AND `check:all` is re-run on the push and a
# tag is created only if it passes. A failing push-side gate blocks the tag, and the deploy that
# depends on it is skipped.
#
# This workflow ships `resolve-env` + `validate` + `version-and-tag` and DELIBERATELY has no
# `deploy` job — neither here in the template nor by default in a spun-up app. The `deploy` job is
# per-app (it names a GCP project, service account, and Workload Identity provider) — copy it in
# from DEPLOY.md when you wire an app to its environment. Nothing in this file deploys anywhere.

name: ci-cd

on:
  pull_request:
  push:
    # Trigger on any branch except obvious non-environment noise; resolve-env then confirms the
    # branch is actually an environment (in environments.json) before any tag/deploy work runs.
    branches-ignore:
      - 'feature/**'
      - 'fix/**'
      - 'chore/**'
      - 'dependabot/**'
      - 'renovate/**'

env:
  NODE_VERSION: '24' # Node major for the gate (keep aligned with .nvmrc)

jobs:
  # Merge gate: PRs must pass the quality gate before they can merge. (The merge is *enforced* by
  # branch protection requiring this check — repo config, not expressible here.)
  validate:
    name: validate (merge gate)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # the gate only reads code — least privilege
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      - run: npm ci
      - run: npm run check:all

  # Push-side gate + derive the version + create the tag. The quality gate is mandatory and runs
  # first; only if it passes does the release-flow Action run. The Action performs BOTH steps of the
  # release flow — resolve-env ("is this branch an environment?") and, if so, derive+push the version
  # tag. A push to a non-environment branch is short-circuited by the Action itself (is-env=false,
  # no tag), so this job needs no separate resolve-env pre-gate. The Action creates a tag only —
  # never a commit or branch push — so environment branches never diverge.
  #
  # Adding an environment is a one-row edit to environments.json (the Action reads it); this job
  # needs no change. What version number a push gets, and which branches are environments, live
  # entirely in the Action + the manifest — not here.
  version-and-tag:
    name: version and tag
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Serialize same-branch runs so two pushes can't derive the same patch concurrently.
    concurrency:
      group: version-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write # to push the TAG only (we never push a commit to the branch)
    outputs:
      is-env: ${{ steps.release.outputs.is-env }} # "true"/"false" — gate a deploy job on this
      version: ${{ steps.release.outputs.version }} # plain number, e.g. 1.5.4 (env pushes only)
      tag: ${{ steps.release.outputs.tag }} # git tag, e.g. v1.5.4-dev (staging) or v1.5.4 (prod)
    steps:
      - uses: actions/checkout@v6
        with:
          # A GITHUB_TOKEN-pushed tag does NOT trigger another workflow (GitHub's recursion guard),
          # which is fine: the deploy is a chained `needs:` job in THIS run, so no second event is
          # needed and no personal access token is required.
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0 # full history + tags — the Action's derivation refuses a shallow clone

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - run: npm ci

      # Push-side gate (mandatory): app code must be green before anything is tagged. On failure the
      # job stops here, the Action never runs, and no tag is created.
      - run: npm run check:all

      # Resolve the environment and derive+push the version tag. All inputs default: branch =
      # github.ref_name, manifest = ./environments.json, major-minor read from package.json's version.
      # No version-strategy → the build-id default, for a deployable app (a published library would
      # instead set version-strategy: package-json). See the Action's CONSUMING.md. The Action
      # configures a git identity itself when the runner has none, so no separate git-config is needed.
      - name: Resolve environment and derive version tag
        id: release
        uses: jeff-fichtner/snackbyte-release-flow-action@v1
